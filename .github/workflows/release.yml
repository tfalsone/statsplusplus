name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Gate: the build/publish job below makes the release public (and therefore
  # the in-app updater's "latest"), so nothing ships unless CI is green for
  # this exact commit. Reuses ci.yml (workflow_call): full Python 3.10-3.13
  # test matrix, mypy and check_docs --strict, with no duplicated steps.
  verify:
    uses: ./.github/workflows/ci.yml

  # The zip name and the in-app update check both key off the version, so the
  # tag must equal the pyproject.toml version.
  tag-matches-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must equal v<pyproject version>
        run: |
          VERSION=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' pyproject.toml | head -n1)
          if [ -z "$VERSION" ] || [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${VERSION}'"
            exit 1
          fi

  build:
    needs: [verify, tag-matches-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create release zip
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ZIPNAME="statsplusplus-${VERSION}.zip"

          _EXCLUDES=(
            ".git/*" ".gitignore" "data/*"
            "__pycache__/*" "*/__pycache__/*" "*.pyc"
            ".kiro/*" ".playwright-mcp/*" "tests/*"
            "docs/screenshots/*" "assets/screenshots/*"
            "assets/*.png" "assets/*.jpg" "samples/*"
            "*.Zone.Identifier" ".venv/*" "MANIFEST.txt"
          )

          # Create a clean zip excluding dev/runtime files
          zip -r "$ZIPNAME" . $(printf -- '-x %s ' "${_EXCLUDES[@]}")

          # Generate MANIFEST.txt from the zip's own contents so it can never
          # drift from what actually ships. Sorted, one relative path per line.
          # The launcher uses this to prune stale files left over from a prior
          # version extracted over the top of this one.
          unzip -Z1 "$ZIPNAME" | grep -v '/$' | sort > MANIFEST.txt
          zip "$ZIPNAME" MANIFEST.txt

          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Stats++ ${{ env.VERSION }}"
          body: |
            ## Stats++ ${{ env.VERSION }}

            ### Quick Start (new install)
            1. Download `${{ env.ZIPNAME }}` below
            2. Extract to a folder
            3. Run the launcher:
               - **Windows:** Double-click `start.bat`
               - **Mac/Linux:** Run `./start.sh`
            4. Your browser will open to the onboarding wizard

            ### Updating an existing install
            Your leagues and settings are preserved — updating only replaces the app's code.
            1. **Stop the app** (press `Ctrl+C` in the launcher window). This matters on Windows, where running files can't be overwritten.
            2. **Download `${{ env.ZIPNAME }}`** below.
            3. **Extract it over your existing install folder** (the one containing `start.sh` / `start.bat`), choosing *replace / merge*. Keeping the same folder is what preserves your `data/`.
            4. **Re-run the launcher.** It reinstalls the updated code, prunes old files, and relaunches — and prints `Updated: vOLD -> vNEW` so you know it took.

            > Tip: if your unzip tool creates a nested `statsplusplus-${{ env.VERSION }}/` folder, move its contents up so `start.sh`/`start.bat` sits at the top level.

            **Requires:** [Python 3.10+](https://www.python.org/downloads/)
          files: ${{ env.ZIPNAME }}
          draft: false
          prerelease: false
