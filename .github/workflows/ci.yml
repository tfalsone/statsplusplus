name: CI

# Stage 1 of the testing pipeline (docs/archive/testing_pipeline_design.md):
# fast, hermetic checks on every push and PR. No network — the live-API tests
# (`-m live_api`) are deselected; they run manually as a contract canary.

on:
  push:
    branches: ["**"]
  pull_request:
  # Reused by release.yml as its `verify` gate.
  workflow_call:

concurrency:
  # Cancel superseded runs on the same ref to save CI minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # We advertise "Python 3.10+" — test the whole supported range.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (hermetic — no live API)
        run: pytest -m "not live_api" -q

  docs:
    name: docs drift (check_docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check_docs compares git commit timestamps; a shallow clone would
          # collapse them all to one commit and hide drift.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Stdlib-only script; no install needed.
      - name: Check living docs against owned code
        run: python scripts/check_docs.py --strict

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Blocking. Modules with known gaps are listed under "TYPING DEBT" in
      # pyproject.toml; shrink that list rather than adding to it.
      - name: Run mypy
        run: mypy
