name: CI

# Stage 1 of the testing pipeline (docs/archive/testing_pipeline_design.md):
# fast, hermetic checks on every push and PR. No network — the live-API tests
# (`-m live_api`) are deselected; they run manually as a contract canary.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Cancel superseded runs on the same ref to save CI minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # We advertise "Python 3.10+" — test the whole supported range.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (hermetic — no live API)
        run: pytest -m "not live_api" -q

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Non-blocking for now: a strict-typing pass is in progress and the data/
      # evaluation modules still have known untyped-def errors. Type errors are
      # surfaced in the logs but do not fail CI. Flip `continue-on-error` to
      # `false` once the typing pass lands.
      - name: Run mypy (non-blocking)
        continue-on-error: true
        run: mypy
