[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statsplusplus"
version = "1.25.0"
description = "Assistant GM dashboard for OOTP Baseball / StatsPlus leagues"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "mypy==1.15.0",
    "hypothesis==6.152.1",
]

[project.scripts]
spp-draft = "statsplusplus.cli.draft_board:main"
spp-trade = "statsplusplus.cli.trade_calculator:main"
spp-targets = "statsplusplus.cli.trade_targets:main"
spp-assets = "statsplusplus.cli.trade_assets:main"
spp-needs = "statsplusplus.cli.team_needs:main"
spp-standings = "statsplusplus.cli.standings:main"
spp-fa = "statsplusplus.cli.free_agents:main"
spp-prospects = "statsplusplus.cli.prospect_query:main"
spp-farm = "statsplusplus.cli.farm_analysis:main"
spp-roster = "statsplusplus.cli.roster_analysis:main"
spp-contract = "statsplusplus.cli.contract_value:main"
spp-prospect-value = "statsplusplus.cli.prospect_value:main"
spp-refresh = "statsplusplus.data.refresh:main"
spp-calibrate = "statsplusplus.data.calibrate:main"
spp-web = "statsplusplus.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"statsplusplus.models" = ["py.typed"]
"statsplusplus.evaluation" = ["py.typed"]
"statsplusplus.config" = ["py.typed"]
"statsplusplus.utils" = ["py.typed"]
"statsplusplus.data" = ["py.typed"]
"statsplusplus.client" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_web: drive the live Flask app against an on-disk fixture (skips the mocked web-context patch)",
    "live_api: hits the real StatsPlus API (needs credentials; deselected in CI via -m 'not live_api')",
]

[tool.mypy]
packages = ["statsplusplus.models", "statsplusplus.evaluation", "statsplusplus.config", "statsplusplus.utils", "statsplusplus.data", "statsplusplus.client"]
strict = true

[[tool.mypy.overrides]]
module = ["statsplusplus.web.*"]
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["statsplusplus.client.*"]
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["statsplusplus.config.league_config"]
disallow_any_expr = false
warn_return_any = false

# TYPING DEBT: shrink this list. Each module below relaxes ONLY the strict
# flags behind the error codes it still has (counts as of the mypy baseline).
# When you touch one of these modules, add annotations and delete the flag (or
# the whole block once it is clean). Every module NOT listed is fully strict,
# so new untyped defs / untyped calls / bare generics there fail CI.
[[tool.mypy.overrides]]  # 130 errors: 96 untyped-call, 33 untyped-def, 1 type-arg
module = ["statsplusplus.data.calibrate"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]  # 112 errors: 70 untyped-call, 41 untyped-def, 1 type-arg
module = ["statsplusplus.data.refresh"]
disallow_untyped_defs = false
